<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Injeel</title>
    <style>
      :root { color-scheme: light; }
      html { overflow-x: clip; }
      body {
        margin: 0;
        background: #f3efe4;
        color: #1c1612;
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      }
      header {
        border-bottom: 1px solid #d9d0c0;
        background: #f3efe4;
      }
      .row {
        display: flex;
        align-items: center;
        max-width: 48rem;
        margin: 0 auto;
        padding: 0.25rem 0.5rem;
      }
      h1 { margin: 0; font-size: 1.125rem; font-weight: 400; line-height: 2.75rem; }
      main { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
      p { margin: 0; max-width: 40rem; font-size: 1.05rem; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        color: #7a2e38;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <h1>Injeel</h1>
      </div>
    </header>
    <main>
      <p>This page isn't on this device yet. Reconnect, or open it once while online.</p>
      <nav>
        <a href="/">All books</a>
        <a href="/offline">Offline</a>
      </nav>
    </main>
  </body>
</html>
