name: INjeel readiness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Never inject production credentials, run install hooks or migrate a DB.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check:data
      - run: npm run typecheck
      - run: npm run build:check
      - run: npm run check:seo:built
